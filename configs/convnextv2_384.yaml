data:
  train_dir:
  train_csv:
  image_root:
  test_dir:
  test_csv:
  image_column:
  label_column:
  val_fraction: 0.2
  folds: 5
  seed: 42
  num_workers: 6
  augment_policy: weather_augmix
  transform_backend: auto
model:
  name: convnextv2_tiny.fcmae_ft_in22k_in1k
  image_size: 384
  pretrained: true
  dropout: 0.1
train:
  epochs: 18
  batch_size: 24
  lr: 0.0002
  weight_decay: 0.0001
  no_weight_decay: true
  layer_decay: 0.85
  label_smoothing: 0.05
  loss_name: class_balanced_focal
  focal_gamma: 1.0
  class_balanced_beta: 0.999
  sampler_mode: auto
  amp: true
  mixup_alpha: 0.15
  cutmix_alpha: 0.25
  ema_decay: 0.999
  output_dir: outputs/convnextv2_384
infer:
  batch_size: 48
  tta: false
  amp: false
  output_csv: submission_convnextv2_384.csv
