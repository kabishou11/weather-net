data:
  train_dir:
  train_csv:
  image_root:
  val_fraction: 0.2
  folds: 1
  seed: 42
  num_workers: 2
  augment_policy: weather_augmix
  transform_backend: auto
model:
  name: efficientnet_b0
  image_size: 224
  pretrained: true
  dropout: 0.1
train:
  epochs: 8
  batch_size: 64
  lr: 0.0004
  weight_decay: 0.0001
  label_smoothing: 0.05
  loss_name: class_balanced
  focal_gamma: 0.0
  class_balanced_beta: 0.999
  sampler_mode: auto
  amp: true
  mixup_alpha: 0.15
  cutmix_alpha: 0.2
  ema_decay: 0.998
  output_dir: outputs/fast_effnet
infer:
  batch_size: 128
  tta: false
  amp: false
  output_csv: submission_fast.csv
