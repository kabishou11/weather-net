data:
  train_dir:
  train_csv:
  image_root:
  test_dir:
  test_csv:
  image_column:
  label_column:
  val_fraction: 0.2
  folds: 1
  seed: 42
  num_workers: 2
  augment_policy: weather_augmix
  transform_backend: auto
model:
  name: convnext_tiny
  image_size: 224
  pretrained: true
  dropout: 0.0
train:
  epochs: 10
  batch_size: 32
  lr: 0.0003
  weight_decay: 0.0001
  label_smoothing: 0.05
  amp: true
  mixup_alpha: 0.2
  cutmix_alpha: 0.3
  ema_decay: 0.999
  output_dir: outputs/convnext_tiny
infer:
  batch_size: 64
  tta: false
  output_csv: submission.csv
